<dialog #dialog class="gallery" (close)="onClose()">
  <div class="gallery-frame">
    <button
      type="button"
      class="gallery-close"
      aria-label="Close"
      (click)="open.set(false)"
    >
      <lib-field-icon name="close" [size]="18" />
    </button>

    @if (current(); as src) {
      <img class="gallery-image" [src]="src" [alt]="alt() + ' ' + (index() + 1)" />
    }

    @if (images().length > 1) {
      <button
        type="button"
        class="gallery-nav prev"
        aria-label="Previous image"
        (click)="step(-1)"
      >
        <lib-field-icon name="chevron-left" [size]="20" />
      </button>
      <button
        type="button"
        class="gallery-nav next"
        aria-label="Next image"
        (click)="step(1)"
      >
        <lib-field-icon name="chevron-right" [size]="20" />
      </button>

      <div class="gallery-dots">
        @for (image of images(); track $index) {
          <button
            type="button"
            class="gallery-dot"
            [class.active]="$index === index()"
            [attr.aria-label]="'Show image ' + ($index + 1)"
            [attr.aria-current]="$index === index() || null"
            (click)="index.set($index)"
          ></button>
        }
      </div>
    }
  </div>
</dialog>
