<form (submit)="onSubmit($event)">
@for (row of groupedFields(); track row[0].key) {
  <div class="form-row" [style.gridTemplateColumns]="'repeat(' + row.length + ', 1fr)'">
    @for (field of row; track field.key) {
      <div class="field-wrapper">
        <ng-container *ngComponentOutlet="FIELD_COMPONENTS[field.type]; inputs: getInputs(field)"></ng-container>
      </div>
    }
  </div>
}
  <button type="submit" [disabled]="userForm()().invalid() || isSubmitting()"
    class="w-full mx-auto px-6 py-2.5 bg-red-800 text-white rounded-xl hover:bg-red-900 transition-colors text-sm font-medium shadow-sm disabled:opacity-50 disabled:cursor-not-allowed">
      {{ isSubmitting() ? 'جاري الرفع...' : submitLabel() }}

  </button>

</form>
