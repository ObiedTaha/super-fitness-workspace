<div class="social-divider"><span>Or</span></div>

<div class="social-row">
  @for (provider of providers; track provider) {
    <button
      type="button"
      class="social-button"
      [attr.aria-label]="'Continue with ' + provider"
      (click)="providerSelected.emit(provider)"
    >
      @switch (provider) {
        @case ('facebook') {
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path
              d="M14 9h2.5V6.2H14c-2 0-3.3 1.3-3.3 3.3V11H9v2.8h1.7V21h2.8v-7.2H16l.4-2.8h-2.9V9.8c0-.5.2-.8.5-.8z"
            />
          </svg>
        }
        @case ('google') {
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path
              d="M21 12.2c0-.7-.1-1.3-.2-1.9H12v3.6h5c-.2 1.2-.9 2.2-1.9 2.9v2.4h3.1c1.8-1.7 2.8-4.1 2.8-7zM12 21c2.5 0 4.6-.8 6.2-2.3l-3.1-2.4c-.8.6-1.9.9-3.1.9-2.4 0-4.5-1.6-5.2-3.8H3.6v2.4C5.2 18.9 8.4 21 12 21zM6.8 13.4c-.2-.6-.3-1.2-.3-1.9s.1-1.3.3-1.9V7.2H3.6C2.9 8.6 2.5 10.2 2.5 12s.4 3.4 1.1 4.8l3.2-2.4zM12 6.3c1.4 0 2.6.5 3.5 1.4l2.6-2.6C16.6 3.6 14.5 2.7 12 2.7 8.4 2.7 5.2 4.8 3.6 7.9l3.2 2.4c.7-2.2 2.8-4 5.2-4z"
            />
          </svg>
        }
        @case ('apple') {
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path
              d="M16.2 12.6c0-2 1.6-3 1.7-3-.9-1.4-2.4-1.6-2.9-1.6-1.2-.1-2.4.7-3 .7s-1.6-.7-2.6-.7c-1.3 0-2.6.8-3.2 2-1.4 2.4-.4 6 1 8 .7 1 1.5 2 2.5 2s1.3-.6 2.5-.6 1.5.6 2.6.6 1.7-1 2.4-1.9c.7-1.1 1-2.2 1-2.2s-2-.8-2-3.3zM14.3 6.3c.5-.7.9-1.6.8-2.6-.8 0-1.8.5-2.4 1.2-.5.6-1 1.6-.8 2.5.9.1 1.8-.4 2.4-1.1z"
            />
          </svg>
        }
      }
    </button>
  }
</div>
