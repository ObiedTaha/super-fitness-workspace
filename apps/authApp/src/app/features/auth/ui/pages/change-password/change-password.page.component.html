<main class="auth-shell">
      <section class="auth-card" aria-labelledby="change-password-title">
        <div class="brand-block">
          <span class="brand-mark">S</span>
          <span class="brand-name">SUPER FITNESS</span>
        </div>

        <h1 id="change-password-title">Change password</h1>
        <p class="subtitle">Update your current credentials securely.</p>

        @if (authStore.error$ | async; as error) {
          <p class="error-message" role="alert">{{ error }}</p>
        }

        <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
          <label class="field">
            <span>Current password</span>
            <input type="password" formControlName="oldPassword" placeholder="Current password" />
          </label>

          <label class="field">
            <span>New password</span>
            <input type="password" formControlName="newPassword" placeholder="Minimum 6 characters" />
          </label>

          <button type="submit" [disabled]="(loading$ | async) ?? false">
            {{ (loading$ | async) ? 'Updating...' : 'Save password' }}
          </button>
        </form>
      </section>
    </main>
